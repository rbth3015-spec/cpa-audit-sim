<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기준서 지식그래프</title>
<!-- 로컬 채점 서버(node tools/serve.mjs)로 열 때만 동작한다. 원문은 이 PC 의 자료/kb/ksa.db 에서 읽는다 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;800&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --bg: #f3f2f2; --panel: #ffffff; --sunk: #eae9e9; --ink: #201e1d; --dim: #5d5a59; --line: #d7d3d3; --red: #ec3013;
    --t-paragraph: #201e1d; --t-standard: #ec3013; --t-concept: #2f5d43; --t-exam: #8a5a00; --t-game: #2c5a8a; --t-other: #8b8785;
    --sans: "Pretendard Variable", Pretendard, "Malgun Gothic", sans-serif; --display: "Archivo", var(--sans); --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #131211; --panel: #1a1918; --sunk: #0e0d0c; --ink: #f3f2f2; --dim: #9b9797; --line: #3a3635; --red: #ff563c;
      --t-paragraph: #f3f2f2; --t-standard: #ff563c; --t-concept: #8fb497; --t-exam: #e0a33c; --t-game: #8ab4e0; --t-other: #9b9797; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 400 14px/1.6 var(--sans); }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; padding: 14px 20px; border-bottom: 2px solid var(--ink); }
  header h1 { margin: 0; font: 800 20px/1.2 var(--display); }
  header .stat { color: var(--dim); font: 400 12px/1.4 var(--mono); }
  nav.tabs { margin-left: auto; display: flex; gap: 4px; }
  nav.tabs button { font: 600 13px var(--sans); background: none; border: 1px solid var(--line); color: var(--ink); padding: 5px 12px; cursor: pointer; }
  nav.tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  main { display: grid; grid-template-columns: minmax(280px, 380px) minmax(0, 1fr); min-height: calc(100vh - 60px); }
  aside { border-right: 1px solid var(--line); padding: 14px 16px; overflow: auto; max-height: calc(100vh - 60px); }
  form.q { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; }
  form.q input, form.q select { font: inherit; padding: 7px 9px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
  form.q .row { display: flex; gap: 6px; }
  form.q .row > * { flex: 1; min-width: 0; }
  form.q label.rw { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--dim); cursor: pointer; }
  form.q label.rw input { margin: 0; }
  .rwline { margin: 10px 0 0; font-size: 12px; color: var(--dim); }
  .rwline b { font: 600 12px var(--mono); color: var(--ink); }
  form.q button { font: 600 13px var(--sans); padding: 7px; background: var(--ink); color: var(--bg); border: 0; cursor: pointer; }
  ol.hits { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 2px; }
  ol.hits li { padding: 8px 6px; border-bottom: 1px solid var(--line); cursor: pointer; }
  ol.hits li:hover, ol.hits li.on { background: var(--sunk); }
  .pid { font: 600 13px var(--mono); }
  .ph { color: var(--dim); font-size: 12px; }
  .why { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 3px; }
  .why span { font: 400 10.5px var(--mono); padding: 1px 5px; border: 1px solid var(--line); color: var(--dim); }
  .why span.b { border-color: var(--t-exam); color: var(--t-exam); }
  .why span.d { border-color: var(--t-game); color: var(--t-game); }
  .why span.g { border-color: var(--t-concept); color: var(--t-concept); }
  section.view { padding: 16px 20px; overflow: auto; max-height: calc(100vh - 60px); min-width: 0; }
  .card h2 { margin: 0 0 4px; font: 700 18px/1.35 var(--sans); }
  .card .meta { color: var(--dim); font-size: 12px; margin-bottom: 8px; }
  .card .txt { max-width: 72ch; white-space: pre-wrap; }
  .card .txt li { margin: 2px 0; }
  #graph { width: 100%; height: 420px; border: 1px solid var(--line); background: var(--panel); margin: 14px 0; display: block; }
  .rels { display: grid; gap: 10px; }
  .rel h3 { margin: 0 0 4px; font: 700 12px var(--sans); color: var(--dim); letter-spacing: .03em; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip { font: 400 12px var(--sans); padding: 2px 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; max-width: 46ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip:hover { border-color: var(--ink); }
  .chip small { color: var(--dim); font-family: var(--mono); }
  .legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--dim); }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
  table.cov { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  table.cov th, table.cov td { padding: 5px 8px; border-bottom: 1px solid var(--line); text-align: left; font-size: 13px; }
  table.cov th { font-size: 12px; color: var(--dim); font-weight: 600; cursor: pointer; }
  table.cov td.n { text-align: right; font-family: var(--mono); }
  .bar { height: 8px; background: var(--sunk); position: relative; min-width: 80px; }
  .bar i { position: absolute; inset: 0 auto 0 0; background: var(--ink); }
  .bar.g i { background: var(--t-game); }
  tr.gap td:first-child { box-shadow: inset 3px 0 var(--red); }
  .empty { color: var(--dim); padding: 24px 0; max-width: 60ch; }
  @media (max-width: 760px) { main { grid-template-columns: minmax(0, 1fr); } aside { border-right: 0; border-bottom: 1px solid var(--line); max-height: none; } section.view { max-height: none; } }
</style>
</head>
<body>
<header>
  <h1>기준서 지식그래프</h1>
  <span class="stat" id="stat">불러오는 중</span>
  <nav class="tabs" role="tablist">
    <button type="button" role="tab" aria-selected="true" data-tab="explore">탐색</button>
    <button type="button" role="tab" aria-selected="false" data-tab="coverage">커버리지</button>
  </nav>
</header>
<main>
  <aside>
    <form class="q" id="q">
      <input id="q-text" name="q" placeholder="물음이나 용어 — 예: 조회서 발송 거부" autocomplete="off">
      <div class="row">
        <select id="q-mode" aria-label="검색 방식">
          <option value="route">기본 (측정으로 고른 경로)</option>
          <option value="hybrid">혼합 (BM25 + 벡터)</option>
          <option value="graph">혼합 + 그래프</option>
          <option value="dense">벡터만</option>
          <option value="bm25">BM25만</option>
        </select>
        <input id="q-std" placeholder="기준서 (예: 505)" inputmode="numeric">
      </div>
      <label class="rw" title="Claude 가 질문을 기준서 용어로 바꿔 쓴 뒤 찾는다 · 10초 안팎 · 같은 질문은 바로"><input type="checkbox" id="q-rw"> 기준서 말로 바꿔 찾기 · 일상어 질문용</label>
      <button type="submit">찾기</button>
    </form>
    <p class="rwline" id="rwline" hidden></p>
    <ol class="hits" id="hits"></ol>
  </aside>
  <section class="view" id="view">
    <p class="empty" id="hello">왼쪽에서 찾거나, 채점표의 근거 번호를 누르면 여기서 열린다. 문단 · 개념 · 기출 문항 · 게임 논점이 관계로 이어져 있다.</p>
  </section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (s) { return document.querySelector(s); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function api(path) { return fetch('api/kb/' + path, { cache: 'no-store' }).then(function (r) { return r.json(); }); }

  var REL = {
    contains: '기준서의 문단', guidance: '적용지침', 'guidance←': '요구사항', refers: '참조하는 문단', 'refers←': '이 문단을 참조', cites_std: '언급한 기준서',
    std_refers: '참조하는 기준서', defines: '정의하는 개념', mentions: '나오는 개념', about: '다루는 기준서', cites: '해설 인용',
    has_point: '논점', grounded_in: '근거 문단'
  };
  var IN = { contains: '속한 기준서', guidance: '요구사항', refers: '이 문단을 참조', defines: '정의 문단', mentions: '이 개념이 나오는 곳', about: '이 기준서를 다룬 것',
    cites: '이 문단을 인용한 해설', has_point: '장면', grounded_in: '이 문단을 근거로 한 게임 논점', cites_std: '이 기준서를 언급한 문단', std_refers: '이 기준서를 참조하는 기준서' };
  var TYPE = { paragraph: '문단', standard: '기준서', concept: '개념', exam_item: '기출 · GS', solution: '해설', issue: '요약집 논점', scene: '게임 장면', point: '게임 논점', card: '개념 카드' };
  var COLOR = function (t) {
    var v = { paragraph: '--t-paragraph', standard: '--t-standard', concept: '--t-concept', exam_item: '--t-exam', solution: '--t-exam', issue: '--t-exam', scene: '--t-game', point: '--t-game', card: '--t-game' }[t] || '--t-other';
    return getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  };

  function whyTags(why) {
    return '<div class="why">' + (why || []).slice(0, 5).map(function (w) {
      var k = /^bm25/.test(w) ? 'b' : /^dense/.test(w) ? 'd' : 'g';
      return '<span class="' + k + '">' + esc(w.replace(/^graph:/, '그래프 ').replace(/:/, ' ')) + '</span>';
    }).join('') + '</div>';
  }

  function search(e) {
    if (e) e.preventDefault();
    var t = $('#q-text').value.trim();
    if (!t) return;
    var rw = $('#q-rw').checked;
    $('#hits').innerHTML = '<li class="ph">' + (rw ? '기준서 말로 바꾸는 중' : '찾는 중') + '</li>';
    $('#rwline').hidden = true;
    api('search?q=' + encodeURIComponent(t) + '&mode=' + $('#q-mode').value + '&std=' + encodeURIComponent($('#q-std').value) + '&k=12' + (rw ? '&rw=1' : '')).then(function (j) {
      if (!j.ok) { $('#hits').innerHTML = '<li class="ph">' + esc(j.error || '실패') + '</li>'; return; }
      if (j.rw) {
        $('#rwline').hidden = false;
        $('#rwline').innerHTML = j.rw.terms ? '바꾼 말 <b>' + esc(j.rw.terms) + '</b> · ' + (j.rw.ms < 100 ? '전에 바꾼 말' : (j.rw.ms / 1000).toFixed(1) + '초')
          : '바꾸지 못함 — 원래 질문으로 찾음 (Claude Code 로그인 · 채점 중이면 잠시 뒤)';
      }
      $('#hits').innerHTML = j.hits.length ? j.hits.map(function (h) {
        return '<li data-id="par:' + esc(h.id) + '"><span class="pid">' + esc(h.id) + '</span> <span class="ph">' + esc(h.kind) + '</span><br>' + esc(h.heading) + whyTags(h.why) + '</li>';
      }).join('') : '<li class="ph">없음</li>';
    });
  }

  function open(id) {
    if (!id) return;
    if (!/^[a-z_]+:/.test(id)) id = 'par:' + id;
    if (location.hash.slice(1) !== id) history.replaceState(null, '', '#' + id);
    document.querySelectorAll('#hits li').forEach(function (li) { li.classList.toggle('on', li.getAttribute('data-id') === id); });
    Promise.all([api('node?id=' + encodeURIComponent(id)), /^par:/.test(id) ? api('par?id=' + encodeURIComponent(id.slice(4))) : Promise.resolve(null)]).then(function (r) {
      var n = r[0], p = r[1] && r[1].par;
      if (!n.ok) { $('#view').innerHTML = '<p class="empty">없는 노드 — ' + esc(id) + '</p>'; return; }
      var head = '<div class="card"><div class="meta">' + esc(TYPE[n.node.type] || n.node.type) + ' · <span class="pid">' + esc(n.node.id) + '</span></div>';
      if (p) {
        head += '<h2>감사기준서 ' + esc(p.std) + ' ' + esc(p.title) + ' — ' + esc(p.id) + '</h2><div class="meta">' + esc(p.kind) + ' · ' + esc(p.heading) + '</div>' +
          '<div class="txt">' + esc(p.text) + (p.items.length ? '<ul>' + p.items.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' : '') + '</div>';
      } else {
        head += '<h2>' + esc(n.node.label) + '</h2>';
        var a = n.node.attrs || {};
        if (a.forms) head += '<div class="meta">표기 · ' + esc(a.forms.join(' / ')) + ' · 나오는 문단 ' + a.df + '</div>';
      }
      head += '</div>';
      var legend = '<div class="legend">' + ['paragraph', 'standard', 'concept', 'exam_item', 'point'].map(function (t) {
        return '<span><i style="background:' + COLOR(t) + '"></i>' + TYPE[t] + '</span>';
      }).join('') + '</div>';
      $('#view').innerHTML = head + '<svg id="graph" role="img" aria-label="이웃 그래프"></svg>' + legend + '<div class="rels">' + rels(n) + '</div>';
      draw(n);
    });
  }

  function rels(n) {
    var groups = {};
    n.out.forEach(function (e) { var k = '→' + e.rel; (groups[k] = groups[k] || { name: REL[e.rel] || e.rel, list: [] }).list.push(e); });
    n.in.forEach(function (e) { var k = '←' + e.rel; (groups[k] = groups[k] || { name: IN[e.rel] || e.rel, list: [] }).list.push(e); });
    return Object.keys(groups).map(function (k) {
      var g = groups[k];
      return '<div class="rel"><h3>' + esc(g.name) + ' · ' + g.list.length + '</h3><div class="chips">' + g.list.slice(0, 60).map(function (e) {
        var extra = e.confidence < 1 ? ' <small>' + e.confidence.toFixed(2) + '</small>' : e.weight > 1 ? ' <small>×' + e.weight + '</small>' : '';
        return '<button type="button" class="chip" data-id="' + esc(e.id) + '" title="' + esc(e.label + ' · 출처 ' + e.source) + '">' + esc(e.label) + extra + '</button>';
      }).join('') + (g.list.length > 60 ? '<span class="ph">외 ' + (g.list.length - 60) + '</span>' : '') + '</div></div>';
    }).join('');
  }

  // 이웃 그래프 — 관계마다 가까운 몇 개만. 너무 흔한 개념(감사인 등)은 빼고 그린다
  function draw(n) {
    if (!window.d3) return;
    var svg = d3.select('#graph'), box = document.getElementById('graph').getBoundingClientRect();
    var W = box.width, H = box.height, seen = {}, nodes = [{ id: n.node.id, label: n.node.label, type: n.node.type, root: true }], links = [];
    seen[n.node.id] = 1;
    var per = {};
    n.out.concat(n.in).forEach(function (e) {
      if (e.rel === 'contains' && n.node.type === 'standard') return;
      var k = e.rel; per[k] = (per[k] || 0) + 1;
      if (per[k] > 7 || seen[e.id]) return;
      seen[e.id] = 1;
      nodes.push({ id: e.id, label: e.label, type: e.type });
      links.push({ source: n.node.id, target: e.id, rel: e.rel });
    });
    svg.attr('viewBox', [0, 0, W, H]);
    var sim = d3.forceSimulation(nodes).force('link', d3.forceLink(links).id(function (d) { return d.id; }).distance(90))
      .force('charge', d3.forceManyBody().strength(-260)).force('center', d3.forceCenter(W / 2, H / 2)).force('collide', d3.forceCollide(18));
    var link = svg.append('g').attr('stroke', COLOR('other')).attr('stroke-opacity', 0.5).selectAll('line').data(links).join('line');
    var g = svg.append('g').selectAll('g').data(nodes).join('g').style('cursor', 'pointer').on('click', function (ev, d) { if (!d.root) open(d.id); });
    g.append('circle').attr('r', function (d) { return d.root ? 9 : 6; }).attr('fill', function (d) { return COLOR(d.type); });
    g.append('text').text(function (d) { return d.label.length > 22 ? d.label.slice(0, 21) + '…' : d.label; })
      .attr('x', 10).attr('y', 4).attr('font-size', 11).attr('fill', getComputedStyle(document.body).color);
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) { for (var i = 0; i < 200; i++) sim.tick(); }
    function tick() {
      nodes.forEach(function (d) { d.x = Math.max(12, Math.min(W - 120, d.x)); d.y = Math.max(12, Math.min(H - 12, d.y)); });
      link.attr('x1', function (d) { return d.source.x; }).attr('y1', function (d) { return d.source.y; }).attr('x2', function (d) { return d.target.x; }).attr('y2', function (d) { return d.target.y; });
      g.attr('transform', function (d) { return 'translate(' + d.x + ',' + d.y + ')'; });
    }
    sim.on('tick', tick);
    if (reduce) { sim.stop(); tick(); }
  }

  // 커버리지 — 기출이 많이 다룬 기준서인데 게임 논점이 적으면 빨간 줄
  function coverage() {
    $('#view').innerHTML = '<p class="empty">불러오는 중</p>';
    api('coverage').then(function (j) {
      var rows = j.rows, maxE = Math.max.apply(null, rows.map(function (r) { return r.exam + r.cited; })) || 1, maxP = Math.max.apply(null, rows.map(function (r) { return r.points; })) || 1;
      var html = '<div class="card"><h2>기준서 커버리지</h2><div class="meta">기출 · GS 문항과 해설 인용(출제 무게)과 게임 논점(검증된 근거)을 기준서마다 견준다. 빨간 줄은 출제 무게가 위쪽 절반인데 게임 논점이 그 절반에 못 미치는 기준서다.</div></div>' +
        '<div style="overflow-x:auto"><table class="cov"><thead><tr><th>기준서</th><th>문단</th><th>기출 · GS</th><th>해설 인용</th><th>출제 무게</th><th>게임 논점</th><th></th><th>장면</th><th>카드</th></tr></thead><tbody>';
      var medE = rows.map(function (r) { return r.exam + r.cited; }).sort(function (a, b) { return a - b; })[Math.floor(rows.length / 2)];
      rows.forEach(function (r) {
        var w = r.exam + r.cited, gap = w > medE && r.points / maxP < 0.5 * w / maxE;
        html += '<tr class="' + (gap ? 'gap' : '') + '"><td><button type="button" class="chip" data-id="' + esc(r.id) + '">' + esc(r.label) + '</button></td><td class="n">' + r.paragraphs + '</td><td class="n">' + r.exam + '</td><td class="n">' + r.cited +
          '</td><td><div class="bar"><i style="width:' + (100 * w / maxE).toFixed(0) + '%"></i></div></td><td class="n">' + r.points + '</td><td><div class="bar g"><i style="width:' + (100 * r.points / maxP).toFixed(0) + '%"></i></div></td><td class="n">' + r.scenes + '</td><td class="n">' + r.cards + '</td></tr>';
      });
      $('#view').innerHTML = html + '</tbody></table></div>';
    });
  }

  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-id]');
    if (t) { setTab('explore'); open(t.getAttribute('data-id')); return; }
    var b = e.target.closest('[data-tab]');
    if (b) { setTab(b.getAttribute('data-tab')); if (b.getAttribute('data-tab') === 'coverage') coverage(); else if (location.hash.length > 1) open(decodeURIComponent(location.hash.slice(1))); }
  });
  function setTab(t) { document.querySelectorAll('[data-tab]').forEach(function (b) { b.setAttribute('aria-selected', String(b.getAttribute('data-tab') === t)); }); }
  $('#q').addEventListener('submit', search);
  window.addEventListener('hashchange', function () { open(decodeURIComponent(location.hash.slice(1))); });

  api('stats').then(function (j) {
    if (!j.ok) { $('#stat').textContent = j.error || '지식베이스 없음'; return; }
    var n = 0, e = 0;
    j.types.forEach(function (t) { n += t.n; });
    j.rels.forEach(function (r) { e += r.n; });
    $('#stat').textContent = '노드 ' + n.toLocaleString() + ' · 엣지 ' + e.toLocaleString() + ' · 벡터 ' + (j.vectors ? j.model : '없음') + ' · DB ' + (j.meta.built_at || '').slice(0, 10);
    if (location.hash.length > 1) open(decodeURIComponent(location.hash.slice(1)));
  }, function () {
    $('#stat').textContent = '로컬 채점 서버로 열어야 한다 — node tools/serve.mjs 후 http://localhost:8765/kb.html';
  });
})();
</script>
