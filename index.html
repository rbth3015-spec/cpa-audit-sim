<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>회계감사 시뮬레이터</title>
<style>
:root{
  --bg:#f7f6f3; --panel:#fff; --ink:#1b1c1f; --ink2:#585c63; --ink3:#8b9098;
  --line:#e3e1db; --line2:#eeece7;
  --acc:#2f5d8a; --acc-w:#eef3f8;
  --ok:#1d7347; --ok-bg:#e9f5ee;
  --bad:#a5302d; --bad-bg:#fbeceb;
  --warn:#87600f; --warn-bg:#fdf4e2;
  --r:10px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#14161a; --panel:#1c1f24; --ink:#e7e8ea; --ink2:#a8acb3; --ink3:#767b84;
    --line:#2d3137; --line2:#24272c;
    --acc:#7fa9d6; --acc-w:#1e2732;
    --ok:#63c290; --ok-bg:#16281f;
    --bad:#e08b88; --bad-bg:#2b1b1b;
    --warn:#dcb367; --warn-bg:#2a2316;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.65 -apple-system,BlinkMacSystemFont,"Pretendard","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:820px;margin:0 auto;padding:0 18px 90px}
h3{font-size:12.5px;letter-spacing:.05em;color:var(--ink3);margin:30px 0 10px;
   text-transform:uppercase;font-weight:700}
.muted{color:var(--ink2);font-size:14px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.hbar{max-width:820px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:12px}
.logo{font-weight:800;letter-spacing:-.02em}
.logo span{color:var(--acc)}
.hsp{flex:1}
.hbtn{background:none;border:1px solid var(--line);color:var(--ink2);padding:5px 11px;
  border-radius:99px;font-size:12.5px;cursor:pointer;font-family:inherit}
.hbtn:hover{border-color:var(--acc);color:var(--acc)}

/* hud */
.hud{display:flex;align-items:center;gap:12px;padding:11px 0 9px;font-size:13px;flex-wrap:wrap}
#hud-paper{font-weight:700;letter-spacing:-.01em}
#hud-pts{color:var(--acc);font-weight:700;font-size:12px}
#hud-prog{color:var(--ink3);font-variant-numeric:tabular-nums;margin-left:auto}
.gtrack{height:3px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:2px}
.gtrack i{display:block;height:100%;background:var(--acc);transition:width .4s}
.avg{font-size:11.5px;color:var(--ink3);text-align:right;padding-bottom:8px}
.avg b{color:var(--ink2)}

/* buttons */
.btn{font-family:inherit;font-size:14px;padding:10px 18px;border-radius:8px;cursor:pointer;
  border:1px solid var(--line);background:var(--panel);color:var(--ink);font-weight:600}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:none}
.btn.ghost:hover{border-color:var(--acc);color:var(--acc)}
.btn.small{padding:7px 13px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:18px 0 4px}
.tmr{margin-left:auto;font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums;font-size:15px}
.tmr.warn{color:var(--bad)}

/* home */
.modes{display:grid;gap:12px;margin-top:22px}
.mode{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r);padding:18px 20px;cursor:pointer;font-family:inherit;color:var(--ink)}
.mode:hover{border-color:var(--acc)}
.mode b{display:block;font-size:16.5px;margin-bottom:3px}
.mode span{display:block;color:var(--ink2);font-size:13.5px}
.mode.alt{cursor:default}.mode.alt:hover{border-color:var(--line)}
.mode select{width:100%;margin:12px 0 9px;padding:8px 10px;border:1px solid var(--line);
  border-radius:7px;background:var(--bg);color:var(--ink);font-family:inherit;font-size:13px}

/* 문제 머리 */
.paper-head{display:flex;align-items:baseline;gap:10px;margin-top:20px;padding-bottom:9px;
  border-bottom:2px solid var(--ink)}
.pno{background:var(--ink);color:var(--bg);font-size:12px;font-weight:800;
  padding:3px 9px;border-radius:4px;letter-spacing:.02em}
.ptitle{font-size:18px;font-weight:800;letter-spacing:-.02em}
.ppts{margin-left:auto;font-size:13px;font-weight:700;color:var(--ink2)}
.pchap{font-size:12px;color:var(--ink3);margin-top:7px}
.pintro{font-size:14.5px;color:var(--ink2);margin:10px 0 0}
.q-no{font-size:15.5px;font-weight:800;margin-top:24px;letter-spacing:-.01em}
.q-kind{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;margin-top:24px}
.q-kind.follow{color:var(--warn)}
.vtag{display:inline-block;font-size:11px;font-weight:600;background:var(--acc-w);color:var(--acc);
  padding:2px 7px;border-radius:5px;vertical-align:2px;margin-left:4px}
.vtag.sm{font-size:10px;padding:1px 5px}
.situation{margin-top:11px;font-size:15px;line-height:1.85}
.prompt{background:var(--acc-w);border-left:3px solid var(--acc);border-radius:0 8px 8px 0;
  padding:13px 16px;margin:18px 0 14px;font-size:15px;font-weight:600;line-height:1.7}

/* 자료 */
.ex{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:12px 0}
.ex-t{font-weight:700;font-size:13px;margin-bottom:9px}
.ex-tag{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);font-weight:700;margin-bottom:5px}
.ex-from,.ex-src{font-size:12.5px;color:var(--ink3);margin-bottom:7px}
.ex-h{font-weight:800;font-size:15px;margin-bottom:6px}
.ex p{margin:0;font-size:14px;color:var(--ink2);line-height:1.75}
.ex-memo{border-left:3px solid var(--warn)}
.ex-news{border-left:3px solid var(--ink3)}
.ex table,.tbl{width:100%;border-collapse:collapse;font-size:13px}
.ex th,.tbl th{text-align:left;color:var(--ink3);font-weight:600;font-size:11.5px;
  padding:5px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
.ex td,.tbl td{padding:6px 9px;border-bottom:1px solid var(--line2)}
.ex td.num,.tbl td.num{text-align:right;font-variant-numeric:tabular-nums}
.ex tr:last-child td{border-bottom:none}
.ex-kv dl{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;margin:0;font-size:13.5px}
.ex-kv dt{color:var(--ink3)}
.ex-kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}

/* 답안 입력 */
.answers{margin-top:4px}
textarea.jtext{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--panel);
  color:var(--ink);padding:11px 13px;font:14.5px/1.8 inherit;resize:vertical;outline:none;display:block}
textarea.jtext:focus{border-color:var(--acc)}
textarea.jtext:disabled{opacity:.75}
.cc{font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums;margin-top:4px;text-align:right}
.ccv.over{color:var(--bad);font-weight:700}

/* judge */
.jrow{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:15px 17px;margin-bottom:12px}
.jhead{display:flex;gap:11px;align-items:flex-start}
.jlabel{flex:none;font-weight:800;font-size:15px;color:var(--acc)}
.jbody{margin:0;font-size:14.5px;line-height:1.8}
.jans{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.oxbox{display:flex;align-items:center;gap:6px;margin-bottom:9px}
.oxq{font-size:11.5px;color:var(--ink3);font-weight:700;margin-right:3px}
.ox{width:40px;height:31px;border:1px solid var(--line);background:var(--bg);color:var(--ink2);
  border-radius:7px;font:700 14px inherit;cursor:pointer}
.ox:hover{border-color:var(--acc)}
.ox.on{background:var(--acc);border-color:var(--acc);color:#fff}
.ox:disabled{cursor:default;opacity:.8}
.jrow textarea{min-height:58px}

/* list */
.lrow{display:flex;align-items:flex-start;gap:10px;margin-bottom:9px}
.llabel{flex:none;width:22px;padding-top:10px;font-weight:800;color:var(--acc)}
.lrow textarea{min-height:42px;overflow:hidden}
.lrow .cc{flex:none;width:56px;padding-top:12px;margin:0}

/* essay */
.essay textarea{min-height:150px}
.ansmeta{margin-top:5px;font-size:11.5px;color:var(--ink3);text-align:right}

/* 결과 */
.res{margin-top:22px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.res-head{display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--line);padding-bottom:13px}
.score b{font-size:32px;font-weight:800;letter-spacing:-.03em}
.score span{color:var(--ink3);font-size:14px;margin-left:3px}
.pct{margin-left:auto;font-weight:800;font-size:16px}
.pct small{font-weight:600;font-size:12px;color:var(--ink3)}
.g-S,.g-A{color:var(--ok)}.g-B{color:var(--acc)}.g-C{color:var(--warn)}.g-D{color:var(--bad)}
.flags{list-style:none;margin:12px 0 0;padding:0}
.flags li{background:var(--warn-bg);color:var(--warn);border-radius:6px;padding:7px 11px;
  font-size:12.5px;font-weight:600;margin-bottom:5px}
.presult{margin-top:16px;padding-top:13px;border-top:1px solid var(--line2)}
.phead{display:flex;align-items:center;gap:9px;margin-bottom:7px;font-size:12.5px}
.plab{font-weight:800;color:var(--acc);font-size:14px}
.oxres{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:5px}
.oxres.ok{background:var(--ok-bg);color:var(--ok)}
.oxres.bad{background:var(--bad-bg);color:var(--bad)}
.pscore{margin-left:auto;color:var(--ink2);font-weight:700;font-variant-numeric:tabular-nums}
.items{list-style:none;margin:0;padding:0;font-size:13.5px}
.items li{display:flex;gap:9px;align-items:flex-start;padding:4px 8px;border-radius:6px;margin-bottom:2px}
.items .mk{width:14px;flex:none;font-weight:700;text-align:center}
.items .lb{flex:1}
.items .lb em{font-style:normal;color:var(--ink3);font-size:12px}
.items .sc{flex:none;color:var(--ink3);font-size:12.5px;font-variant-numeric:tabular-nums}
.items li.ok{background:var(--ok-bg)}.items li.ok .mk{color:var(--ok)}
.items li.miss{opacity:.72}.items li.miss .mk{color:var(--ink3)}
.items li.neg{background:var(--warn-bg)}.items li.neg .mk{color:var(--warn)}
.items li.bad{background:var(--bad-bg)}.items li.bad .mk{color:var(--bad)}
.items li.bad .sc{color:var(--bad);font-weight:700}
.items li.ok-dim{opacity:.4}
.items li.st{opacity:.8;font-size:12.5px}
.model{margin-top:18px;border-top:1px solid var(--line);padding-top:13px}
.model summary{cursor:pointer;font-weight:700;font-size:13.5px;color:var(--acc);list-style:none}
.model summary::-webkit-details-marker{display:none}
.model summary::before{content:"▸ "}
.model[open] summary::before{content:"▾ "}
.model p{font-size:14.5px;line-height:1.85;color:var(--ink2);margin:11px 0 0}
.ref{font-size:12px;color:var(--ink3);border-top:1px dashed var(--line);padding-top:8px;margin-top:11px}

/* 최종 */
.final-score{text-align:center;padding:32px 0 24px;border-bottom:1px solid var(--line)}
.fs-g{font-size:58px;font-weight:800;line-height:1;letter-spacing:-.04em}
.fs-n{font-size:18px;margin-top:8px;font-variant-numeric:tabular-nums}
.fs-n b{font-size:26px;font-weight:800}
.fs-sub{color:var(--ink3);font-size:13px;margin-top:5px}
.bars{display:grid;gap:6px}
.bar{display:flex;align-items:center;gap:11px;font-size:13px}
.bl{width:96px;flex:none;color:var(--ink2);font-size:12.5px}
.bt{flex:1;height:7px;background:var(--line);border-radius:99px;overflow:hidden}
.bt i{display:block;height:100%;background:var(--acc);border-radius:99px}
.bv{width:32px;text-align:right;color:var(--ink2);font-size:12.5px;font-variant-numeric:tabular-nums}
.missed{list-style:none;margin:0;padding:0;font-size:13.5px}
.missed li{padding:7px 0;border-bottom:1px solid var(--line2)}
.missed em{font-style:normal;color:var(--ink3);font-size:12px}
.mtag{display:inline-block;background:var(--line2);border-radius:5px;padding:1px 7px;
  font-size:11.5px;margin-right:8px;color:var(--ink2)}
.outbox{width:100%;height:180px;margin-top:14px;font:12px/1.6 ui-monospace,Consolas,monospace;
  border:1px solid var(--line);border-radius:8px;padding:11px;background:var(--panel);color:var(--ink2)}
[hidden]{display:none!important}
</style>
</head>
<body>

<header>
  <div class="hbar">
    <div class="logo">회계감사 <span>시뮬레이터</span></div>
    <div class="hsp"></div>
    <button id="btn-quit" class="hbtn">처음으로</button>
  </div>
</header>

<div class="wrap">

  <section id="screen-home"><div id="home-body"></div></section>

  <section id="screen-play" hidden>
    <div class="hud">
      <span id="hud-paper"></span><span id="hud-pts"></span><span id="hud-prog"></span>
    </div>
    <div class="gtrack"><i id="g-bar" style="width:0%"></i></div>
    <div class="avg">누적 평균 <b id="g-avg">—</b></div>
    <div id="play-body"></div>
  </section>

  <section id="screen-final" hidden><div id="final-body"></div></section>

</div>

<script src="data/lexicon.js"></script>
<script src="data/cases.js"></script>
<script src="js/engine.js"></script>
<script src="js/game.js"></script>
</body>
</html>
