<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>감사 시즌 2026</title>
<style>
:root{
  --bg:#f7f6f3; --panel:#fff; --ink:#1b1c1f; --ink2:#585c63; --ink3:#8b9098;
  --line:#e3e1db; --line2:#eeece7;
  --acc:#2f5d8a; --acc-w:#eef3f8;
  --ok:#1d7347; --ok-bg:#e9f5ee;
  --bad:#a5302d; --bad-bg:#fbeceb;
  --warn:#87600f; --warn-bg:#fdf4e2;
  --r:12px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#14161a; --panel:#1c1f24; --ink:#e7e8ea; --ink2:#a8acb3; --ink3:#767b84;
    --line:#2d3137; --line2:#24272c;
    --acc:#7fa9d6; --acc-w:#1e2732;
    --ok:#63c290; --ok-bg:#16281f;
    --bad:#e08b88; --bad-bg:#2b1b1b;
    --warn:#dcb367; --warn-bg:#2a2316;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.65 -apple-system,BlinkMacSystemFont,"Pretendard","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:840px;margin:0 auto;padding:0 18px 90px}
h2{font-size:26px;letter-spacing:-.03em;margin:0 0 8px}
h3{font-size:12.5px;letter-spacing:.05em;color:var(--ink3);margin:30px 0 10px;text-transform:uppercase;font-weight:700}
.muted{color:var(--ink2);font-size:14px}
.scroll{overflow-x:auto}

header{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.hbar{max-width:840px;margin:0 auto;padding:11px 18px;display:flex;align-items:center;gap:12px}
.logo{font-weight:800;letter-spacing:-.02em}
.logo span{color:var(--acc)}
.hsp{flex:1}
.hbtn{background:none;border:1px solid var(--line);color:var(--ink2);padding:5px 11px;
  border-radius:99px;font-size:12.5px;cursor:pointer;font-family:inherit}
.hbtn:hover{border-color:var(--acc);color:var(--acc)}

/* ── 장면 아트 ── */
.scene{position:relative;border-radius:var(--r);overflow:hidden;margin:18px 0 0;
  border:1px solid var(--line);animation:fade .5s ease}
.scene svg.art{display:block;width:100%;height:150px}
.scene-tag{position:absolute;left:12px;bottom:10px;background:var(--panel);border:1px solid var(--line);
  color:var(--ink2);font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;opacity:.94}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ── HUD ── */
.hud{display:flex;align-items:center;gap:10px;padding:12px 0 4px;font-size:13px;flex-wrap:wrap}
#hud-day{font-variant-numeric:tabular-nums;color:var(--ink3);font-size:12px}
#hud-ch{font-weight:800;letter-spacing:-.01em;font-size:15px}
#hud-n{margin-left:auto;color:var(--ink3);font-variant-numeric:tabular-nums;font-size:12px}
#gauges{display:flex;gap:16px;padding:6px 0 12px;border-bottom:1px solid var(--line)}
.gz{display:flex;align-items:center;gap:7px}
svg.ring{width:42px;height:42px;flex:none}
.ringlab{font-size:11.5px;color:var(--ink3);font-weight:600}

/* ── 대사 ── */
.say{display:flex;gap:11px;align-items:flex-start;margin:16px 0 4px;animation:fade .45s ease}
svg.avatar{width:46px;height:46px;flex:none;border-radius:50%}
.bubble{background:var(--panel);border:1px solid var(--line);border-radius:4px 12px 12px 12px;
  padding:11px 15px;flex:1}
.bubble b{font-size:13.5px}
.bubble span{font-size:11.5px;color:var(--ink3);margin-left:7px}
.bubble p{margin:5px 0 0;font-size:14.5px;line-height:1.7}
.toast{background:var(--ok-bg);color:var(--ok);border-radius:8px;padding:10px 14px;margin-top:14px;
  font-size:13.5px;font-weight:600;animation:fade .5s ease}

.situation{margin-top:14px;font-size:15px;line-height:1.85}

/* ── 자료 ── */
.ex{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:12px 0}
.ex-t{font-weight:700;font-size:13px;margin-bottom:9px}
.ex-tag{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);font-weight:700;margin-bottom:5px}
.ex-from{font-size:12.5px;color:var(--ink3);margin-bottom:7px}
.ex p{margin:0;font-size:14px;color:var(--ink2);line-height:1.75}
.ex-memo{border-left:3px solid var(--warn)}
.ex table,.tbl{width:100%;border-collapse:collapse;font-size:13px}
.ex th,.tbl th{text-align:left;color:var(--ink3);font-weight:600;font-size:11.5px;padding:5px 9px;
  border-bottom:1px solid var(--line);white-space:nowrap}
.ex td,.tbl td{padding:6px 9px;border-bottom:1px solid var(--line2)}
.ex td.num,.tbl td.num{text-align:right;font-variant-numeric:tabular-nums}
.ex tr:last-child td{border-bottom:none;font-weight:700}
.ex-kv dl{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;margin:0;font-size:13.5px}
.ex-kv dt{color:var(--ink3)}
.ex-kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}

/* ── 문항 · 입력 ── */
.prompt{background:var(--acc-w);border-left:3px solid var(--acc);border-radius:0 8px 8px 0;
  padding:13px 16px;margin:18px 0 10px;font-size:15px;font-weight:600;line-height:1.7}
.vhint{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:9px 13px;
  font-size:12.5px;margin-bottom:10px}
.ansbox textarea{width:100%;min-height:150px;border:1px solid var(--line);border-radius:10px;
  background:var(--panel);color:var(--ink);padding:13px 15px;font:15px/1.85 inherit;resize:vertical;outline:none;display:block}
.ansbox textarea:focus{border-color:var(--acc)}
.ansmeta{margin-top:5px;font-size:11.5px;color:var(--ink3);text-align:right;font-variant-numeric:tabular-nums}
#cc.over{color:var(--bad);font-weight:700}

.btn{font-family:inherit;font-size:14px;padding:10px 18px;border-radius:8px;cursor:pointer;
  border:1px solid var(--line);background:var(--panel);color:var(--ink);font-weight:600}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:none}
.btn.ghost:hover{border-color:var(--acc);color:var(--acc)}
.btn.big{padding:14px 28px;font-size:16px;margin-top:18px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:16px 0 4px}
.tmr{margin-left:auto;font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums;font-size:15px}
.tmr.warn{color:var(--bad)}

/* ── 결과 ── */
.res{margin-top:20px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:18px 20px;animation:fade .4s ease}
.res-head{display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--line);padding-bottom:12px}
.score b{font-size:34px;font-weight:800;letter-spacing:-.03em}
.score span{color:var(--ink3);font-size:14px;margin-left:3px}
.pct{margin-left:auto;font-weight:800;font-size:20px}
.g-S,.g-A{color:var(--ok)}.g-B{color:var(--acc)}.g-C{color:var(--warn)}.g-D{color:var(--bad)}
.vres{margin-top:12px;border-radius:8px;padding:9px 13px;font-size:13px;font-weight:700}
.vres.ok{background:var(--ok-bg);color:var(--ok)}
.vres.bad{background:var(--bad-bg);color:var(--bad)}
.flags{list-style:none;margin:12px 0 0;padding:0}
.flags li{background:var(--warn-bg);color:var(--warn);border-radius:6px;padding:7px 11px;
  font-size:12.5px;font-weight:600;margin-bottom:5px}
.items{list-style:none;margin:14px 0 0;padding:0;font-size:13.5px}
.items li{display:flex;gap:9px;align-items:flex-start;padding:4px 8px;border-radius:6px;margin-bottom:2px}
.items .mk{width:14px;flex:none;font-weight:700;text-align:center}
.items .lb{flex:1}
.items .lb em{font-style:normal;color:var(--ink3);font-size:12px}
.items .sc{flex:none;color:var(--ink3);font-size:12.5px;font-variant-numeric:tabular-nums}
.items li.ok{background:var(--ok-bg)}.items li.ok .mk{color:var(--ok)}
.items li.miss{opacity:.72}.items li.miss .mk{color:var(--ink3)}
.items li.neg{background:var(--warn-bg)}.items li.neg .mk{color:var(--warn)}
.items li.bad{background:var(--bad-bg)}.items li.bad .mk{color:var(--bad)}
.items li.bad .sc{color:var(--bad);font-weight:700}
.items li.st{opacity:.75;font-size:12.5px}
.model{margin-top:18px;border-top:1px solid var(--line);padding-top:13px}
.model summary{cursor:pointer;font-weight:700;font-size:13.5px;color:var(--acc);list-style:none}
.model summary::-webkit-details-marker{display:none}
.model summary::before{content:"▸ "}
.model[open] summary::before{content:"▾ "}
.model p{font-size:14.5px;line-height:1.85;color:var(--ink2);margin:11px 0 0}
.ref{font-size:12px;color:var(--ink3);border-top:1px dashed var(--line);padding-top:8px;margin-top:11px}

/* ── 홈 ── */
.hero{padding:22px 2px 6px}
.hero p{font-size:15px;line-height:1.8;color:var(--ink2);margin:8px 0}
.hero-sub{font-size:14px!important}
.rules{list-style:none;margin:16px 0 0;padding:0;font-size:13.5px}
.rules li{background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:9px 13px;margin-bottom:6px;color:var(--ink2)}
.rules b{color:var(--ink)}

/* ── 엔딩 ── */
.ending{margin-top:18px;border-radius:var(--r);padding:22px 24px;border:1px solid var(--line);
  background:var(--panel);animation:fade .6s ease}
.ending.ok{border-left:5px solid var(--ok)}
.ending.warn{border-left:5px solid var(--warn)}
.ending.bad{border-left:5px solid var(--bad)}
.etag{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:800}
.ending h2{margin:6px 0 10px}
.ending p{margin:0;font-size:15px;line-height:1.85;color:var(--ink2)}
.finalg{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;margin:24px 0 8px;
  padding:18px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.bars{display:grid;gap:6px}
.bar{display:flex;align-items:center;gap:11px;font-size:13px}
.bl{width:150px;flex:none;color:var(--ink2);font-size:12.5px}
.bt{flex:1;height:7px;background:var(--line);border-radius:99px;overflow:hidden}
.bt i{display:block;height:100%;background:var(--acc);border-radius:99px}
.bv{width:30px;text-align:right;color:var(--ink2);font-size:12.5px;font-variant-numeric:tabular-nums}
.missed{list-style:none;margin:0;padding:0;font-size:13.5px}
.missed li{padding:7px 0;border-bottom:1px solid var(--line2)}
.missed em{font-style:normal;color:var(--ink3);font-size:12px}
.mtag{display:inline-block;background:var(--line2);border-radius:5px;padding:1px 7px;
  font-size:11.5px;margin-right:8px;color:var(--ink2)}
.outbox{width:100%;height:180px;margin-top:14px;font:12px/1.6 ui-monospace,Consolas,monospace;
  border:1px solid var(--line);border-radius:8px;padding:11px;background:var(--panel);color:var(--ink2)}
[hidden]{display:none!important}
@media (max-width:520px){
  .scene svg.art{height:118px}
  .bl{width:96px}
  #gauges{gap:10px}
}
</style>
</head>
<body>

<header>
  <div class="hbar">
    <div class="logo">감사 시즌 <span>2026</span></div>
    <div class="hsp"></div>
    <button id="btn-quit" class="hbtn">처음으로</button>
  </div>
</header>

<div class="wrap">
  <section id="screen-home"><div id="home-body"></div></section>

  <section id="screen-play" hidden>
    <div class="hud"><span id="hud-day"></span><span id="hud-ch"></span><span id="hud-n"></span></div>
    <div id="gauges"></div>
    <div id="play-body"></div>
  </section>

  <section id="screen-end" hidden><div id="end-body"></div></section>
</div>

<script src="data/lexicon.js"></script>
<script src="data/scenes.js"></script>
<script src="js/art.js"></script>
<script src="js/engine.js"></script>
<script src="js/game.js"></script>
</body>
</html>
